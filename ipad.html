<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Squishy Coloring Studio — iPad</title><style>body{font-family:Arial,sans-serif;background:#f5f3ff;color:#302b45;margin:0;padding:12px}h2{margin:5px 0 12px}.gallery{display:flex;flex-wrap:wrap;gap:5px}.gallery button{padding:8px;background:white;border:1px solid #ccc;border-radius:8px}.gallery button.active{background:#6945d8;color:white}.tools{margin:12px 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px}.swatch{width:35px;height:35px;border:2px solid #888;border-radius:50%}.stage{position:relative;width:100%;background:white;touch-action:none}.stage img{display:block;width:100%;height:auto;position:relative;z-index:2;pointer-events:none}.stage canvas{position:absolute;left:0;top:0;width:100%;height:100%;z-index:1;touch-action:none}button{font-size:15px;padding:9px}#status{font-weight:bold}</style></head><body><h2>🎨 Squishy Coloring Studio — iPad</h2><div class="gallery" id="gallery"></div><div class="tools"><button id="fill">🪣 Заливка</button><button id="brush">🖌️ Пензлик</button><button id="eraser">◻️ Гумка</button><div id="colors"></div><input type="color" id="custom" value="#ff80ab"><button id="clear">Очистити</button><button id="save">Зберегти PNG</button></div><p id="status">Завантаження...</p><div class="stage" id="stage"><canvas id="paint" width="768" height="512"></canvas><img id="drawing" src="./images/scene-01.png" alt="Розмальовка"></div><script>
(function(){'use strict';var W=768,H=512,scene=0,mode='fill',color='#ff80ab',drawing=false,ready=false,mask=null,history=[],saved={},canvas=document.getElementById('paint'),ctx=canvas.getContext('2d'),picture=document.getElementById('drawing'),stage=document.getElementById('stage'),status=document.getElementById('status'),gallery=document.getElementById('gallery');var names=['Веселкова дорога','На пляжі','У космосі','День народження','Чарівний замок','Суші-ресторан','Весняний пікнік','Зимові забави','Підводна пригода','Парк атракціонів','Кухня солодощів','Нічний кемпінг'];var palettes=['#ff80ab','#ff6b6b','#ff9d42','#ffd93d','#a6dc69','#40c9a2','#61c9f4','#5286ff','#aa83ee','#b68b65','#ffffff'];function say(t){status.textContent=t}function path(i){return './images/scene-'+('0'+(i+1)).slice(-2)+'.png'}function select(i){if(ready){try{saved[scene]=canvas.toDataURL()}catch(e){}}scene=i;ready=false;mask=null;canvas.width=W;canvas.height=H;ctx=canvas.getContext('2d');if(saved[i]){var s=new Image();s.onload=function(){if(scene===i)ctx.drawImage(s,0,0,W,H)};s.src=saved[i]}picture.src=path(i);say('Завантаження картинки...');for(var j=0;j<gallery.children.length;j++)gallery.children[j].className=j===i?'active':''}for(var i=0;i<12;i++){(function(n){var b=document.createElement('button');b.textContent=(n+1)+'. '+names[n];b.onclick=function(){select(n)};gallery.appendChild(b)})(i)}for(var k=0;k<palettes.length;k++){(function(c){var b=document.createElement('button');b.className='swatch';b.style.background=c;b.onclick=function(){color=c};document.getElementById('colors').appendChild(b)})(palettes[k])}document.getElementById('custom').onchange=function(){color=this.value};document.getElementById('fill').onclick=function(){mode='fill';say('Режим заливки')};document.getElementById('brush').onclick=function(){mode='brush';say('Режим пензлика')};document.getElementById('eraser').onclick=function(){mode='eraser';say('Режим гумки')};document.getElementById('clear').onclick=function(){ctx.clearRect(0,0,W,H);saved[scene]=null;say('Очищено')};document.getElementById('save').onclick=function(){var c=document.createElement('canvas');c.width=W;c.height=H;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.drawImage(canvas,0,0);x.drawImage(picture,0,0,W,H);var a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='squishy-'+(scene+1)+'.png';a.click()};picture.onload=function(){ready=true;say('Малюнок готовий!');try{var off=document.createElement('canvas');off.width=W;off.height=H;var x=off.getContext('2d');x.drawImage(picture,0,0,W,H);var d=x.getImageData(0,0,W,H).data;mask=new Uint8Array(W*H);for(var j=0;j<W*H;j++){var t=j*4;mask[j]=(d[t]+d[t+1]+d[t+2])<540?1:0}}catch(e){mask=null;say('Малюнок готовий, заливка може не працювати')}};picture.onerror=function(){ready=false;say('Помилка завантаження зображення')};function point(t){var r=stage.getBoundingClientRect();return{x:Math.max(0,Math.min(W-1,Math.floor((t.clientX-r.left)*W/r.width))),y:Math.max(0,Math.min(H-1,Math.floor((t.clientY-r.top)*H/r.height)))}}function stroke(a,b){ctx.save();ctx.globalCompositeOperation=mode==='eraser'?'destination-out':'source-over';ctx.strokeStyle=color;ctx.lineWidth=15;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.restore()}function fill(pt){if(!mask){say('Заливка недоступна; спробуй пензлик');return}var d=ctx.getImageData(0,0,W,H),pixels=d.data,idx=pt.y*W+pt.x,at=idx*4,old=[pixels[at],pixels[at+1],pixels[at+2],pixels[at+3]],rgb=[parseInt(color.slice(1,3),16),parseInt(color.slice(3,5),16),parseInt(color.slice(5,7),16)],seen=new Uint8Array(W*H),stack=[idx];if(mask[idx])return;while(stack.length){var n=stack.pop();if(seen[n]||mask[n])continue;seen[n]=1;var j=n*4;if(pixels[j]!==old[0]||pixels[j+1]!==old[1]||pixels[j+2]!==old[2]||pixels[j+3]!==old[3])continue;pixels[j]=rgb[0];pixels[j+1]=rgb[1];pixels[j+2]=rgb[2];pixels[j+3]=255;var x=n%W;if(x>0)stack.push(n-1);if(x<W-1)stack.push(n+1);if(n>=W)stack.push(n-W);if(n<W*(H-1))stack.push(n+W)}ctx.putImageData(d,0,0);say('Зафарбовано!')}var last=null;function down(e){if(!ready)return;var t=e.touches?e.touches[0]:e;if(!t)return;e.preventDefault();var pt=point(t);if(mode==='fill'){fill(pt);return}drawing=true;last=pt;stroke(pt,pt)}function move(e){if(!drawing)return;var t=e.touches?e.touches[0]:e;if(!t)return;e.preventDefault();var pt=point(t);stroke(last,pt);last=pt}function up(){drawing=false;last=null}stage.addEventListener('touchstart',down,{passive:false});stage.addEventListener('touchmove',move,{passive:false});stage.addEventListener('touchend',up);stage.addEventListener('mousedown',down);stage.addEventListener('mousemove',move);window.addEventListener('mouseup',up);select(0)})();
</script></body></html>
