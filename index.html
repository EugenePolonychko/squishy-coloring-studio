<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Squishy Coloring Studio</title><meta name="theme-color" content="#6945d8"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#283045;background:#f5f3ff}*{box-sizing:border-box}body{margin:0}.app{max-width:1320px;margin:auto;padding:20px}h1{margin:0;font-size:26px}.sub{color:#6b6681;margin:5px 0 16px}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:9px;background:white;padding:13px;border-radius:18px;box-shadow:0 4px 22px #3b276215;margin-bottom:14px}button{cursor:pointer;border:1px solid #ded9ee;border-radius:11px;background:#fff;color:#302b45;padding:10px 13px;font-size:15px;font-weight:600}button.active{background:#6945d8;color:white;border-color:#6945d8}button:hover{filter:brightness(.96)}button:disabled{opacity:.4;cursor:default}.divider{height:30px;border-left:1px solid #ddd;margin:0 4px}.swatches{display:flex;gap:5px;flex-wrap:wrap}.swatch{width:29px;height:29px;border:2px solid white;border-radius:50%;padding:0;box-shadow:0 0 0 1px #ddd}.swatch.selected{box-shadow:0 0 0 3px #6945d8}.size{width:100px;accent-color:#6945d8}.stage{background:#fff;border-radius:16px;padding:9px;box-shadow:0 6px 30px #3b276215;overflow:auto}.art{position:relative;width:100%;max-width:1536px;aspect-ratio:3/2;margin:auto;touch-action:none;cursor:crosshair}.art canvas{position:absolute;inset:0;width:100%;height:100%}.art #line{pointer-events:none}.art #artPreview{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;mix-blend-mode:multiply;z-index:3}.footer{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px;color:#6b6681;font-size:14px}.save{background:#6945d8;color:white}.status{font-weight:600}@media(max-width:600px){.app{padding:9px}h1{font-size:21px}.toolbar{gap:6px;padding:9px}button{font-size:13px;padding:8px}.swatch{width:26px;height:26px}}
.gallery-wrap{background:white;padding:12px;border-radius:18px;margin-bottom:14px;box-shadow:0 4px 22px #3b276215}.gallery-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}.gallery-head span{color:#6945d8;font-weight:600}.gallery{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}.scene-card{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 4px;min-height:76px;font-size:12px;line-height:1.25}.scene-card.chosen{background:#ede7ff;border:2px solid #6945d8;color:#44259b}.scene-icon{font-size:27px}@media(max-width:800px){.gallery{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:480px){.gallery{grid-template-columns:repeat(3,minmax(0,1fr))}.scene-card{font-size:11px}} </style></head><body><main class="app"><h1>🎨 Squishy Coloring Studio v2.1</h1><p class="sub">Обирай колір і натискай на ділянку, щоб зафарбувати її. Чорні лінії залишаться зверху.</p><section class="gallery-wrap"><div class="gallery-head"><strong>Обери розмальовку</strong><span id="currentScene">1 / 12 — Веселкова дорога</span></div><div id="gallery" class="gallery"></div></section><section class="toolbar" aria-label="Інструменти"><button id="fill" class="active">🪣 Заливка</button><button id="brush">🖌️ Пензлик</button><button id="eraser">◻️ Гумка</button><span class="divider"></span><div id="swatches" class="swatches"></div><label title="Власний колір">🎨 <input id="picker" type="color" value="#ff80ab"></label><span class="divider"></span><label>Розмір <input id="size" class="size" type="range" min="3" max="65" value="18"><span id="sizeText">18</span></label><span class="divider"></span><button id="undo" disabled>↶ Назад</button><button id="clear">Очистити</button><button id="save" class="save">⬇ Зберегти PNG</button></section><div class="stage"><div class="art" id="art"><canvas id="paint" width="1536" height="1024"></canvas><canvas id="line" width="1536" height="1024"></canvas><img id="artPreview" alt="Розмальовка" decoding="async"></div></div><div class="footer"><span class="status" id="status">Готово до розмальовування!</span><span>Порада: заливка найкраще працює в замкнених контурах. Пензлик дозволяє малювати довільно.</span></div></main><script>
const STORE='squishy-v2-android';
function persist(){try{localStorage.setItem(STORE,JSON.stringify({scene:currentScene,states:sceneStates}));}catch(e){}}
window.addEventListener('pagehide',()=>{sceneStates[currentScene]=paint.toDataURL('image/png');persist();});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=5').catch(()=>{}));
const sceneImages=["./images/scene-01.png", "./images/scene-02.png", "./images/scene-03.png", "./images/scene-04.png", "./images/scene-05.png", "./images/scene-06.png", "./images/scene-07.png", "./images/scene-08.png", "./images/scene-09.png", "./images/scene-10.png", "./images/scene-11.png", "./images/scene-12.png"];
const sceneNames=["Веселкова дорога", "На пляжі", "У космосі", "День народження", "Чарівний замок", "Суші-ресторан", "Весняний пікнік", "Зимові забави", "Підводна пригода", "Парк атракціонів", "Кухня солодощів", "Нічний кемпінг"];
const W=1536,H=1024, paint=document.getElementById('paint'),line=document.getElementById('line'),l=line.getContext('2d',{willReadFrequently:true});let p=paint.getContext('2d',{willReadFrequently:true});let tool='fill',color='#ff80ab',brushSize=18,drawing=false,last=null,history=[],blocked=null;
const colors=['#ff80ab','#ff6b6b','#ff9d42','#ffd93d','#a6dc69','#40c9a2','#61c9f4','#5286ff','#aa83ee','#edabda','#b68b65','#ffffff'];const swatches=document.getElementById('swatches');
function status(s){document.getElementById('status').textContent=s}function selectColor(c){color=c;document.getElementById('picker').value=c;[...swatches.children].forEach(b=>b.classList.toggle('selected',b.dataset.color===c))}
colors.forEach(c=>{const b=document.createElement('button');b.className='swatch';b.style.background=c;b.dataset.color=c;b.title=c;b.onclick=()=>selectColor(c);swatches.append(b)});selectColor(color);
let currentScene=0;const sceneStates=Array(12).fill(null);const img=new Image();const artPreview=document.getElementById("artPreview");let imageLoadId=0;img.onerror=()=>{artPreview.style.display="none";blocked=null;status('⚠️ Не вдалося завантажити картинку. Спробуй вибрати її ще раз.');};img.onload=()=>{artPreview.src=img.src;artPreview.style.display="block";l.clearRect(0,0,W,H);l.drawImage(img,0,0,W,H);const layer=l.getImageData(0,0,W,H);const a=layer.data;blocked=new Uint8Array(W*H);for(let i=0;i<W*H;i++){const j=i*4;const gray=(a[j]*0.299+a[j+1]*0.587+a[j+2]*0.114);if(gray<185)blocked[i]=1;const opacity=Math.max(0,Math.min(255,Math.round((255-gray)*1.5)));a[j]=0;a[j+1]=0;a[j+2]=0;a[j+3]=opacity;}l.putImageData(layer,0,0); // Transparent white background so colors underneath are visible
// Thicken outlines slightly to avoid spills through antialiasing gaps
const original=blocked.slice();for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){let i=y*W+x;if(original[i-1]||original[i+1]||original[i-W]||original[i+W])blocked[i]=1;}if(sceneStates[currentScene]){const saved=new Image();saved.onload=()=>p.drawImage(saved,0,0,W,H);saved.src=sceneStates[currentScene]}status('Обери колір і торкнися ділянки!')};img.src=sceneImages[0]+'?v=5';
function setTool(t){tool=t;['fill','brush','eraser'].forEach(k=>document.getElementById(k).classList.toggle('active',k===t));status(t==='fill'?'Натисни всередині замкненої області':t==='brush'?'Малюй пензликом':'Стирай кольори гумкою')};['fill','brush','eraser'].forEach(k=>document.getElementById(k).onclick=()=>setTool(k));document.getElementById('picker').oninput=e=>selectColor(e.target.value);document.getElementById('size').oninput=e=>{brushSize=+e.target.value;document.getElementById('sizeText').textContent=brushSize};
function snapshot(){history.push(p.getImageData(0,0,W,H));if(history.length>12)history.shift();document.getElementById('undo').disabled=false}document.getElementById('undo').onclick=()=>{if(history.length){p.putImageData(history.pop(),0,0);document.getElementById('undo').disabled=!history.length;status('Останню дію скасовано')}};
function pos(e){const r=paint.getBoundingClientRect();return{x:Math.max(0,Math.min(W-1,Math.floor((e.clientX-r.left)*W/r.width))),y:Math.max(0,Math.min(H-1,Math.floor((e.clientY-r.top)*H/r.height)))}}function rgb(hex){return [1,3,5].map(i=>parseInt(hex.slice(i,i+2),16))}
function flood(x,y){if(!blocked){status('Зображення ще завантажується');return}const start=y*W+x;if(blocked[start]){status('Натисни трохи далі від чорної лінії');return}const pixels=p.getImageData(0,0,W,H),d=pixels.data,target=start*4,old=[d[target],d[target+1],d[target+2],d[target+3]],c=rgb(color);if(old[0]===c[0]&&old[1]===c[1]&&old[2]===c[2]&&old[3]===255)return;
snapshot();const seen=new Uint8Array(W*H),stack=new Int32Array(W*H);let top=0;stack[top++]=start;seen[start]=1;let count=0;while(top){const i=stack[--top],j=i*4;if(blocked[i]||d[j]!==old[0]||d[j+1]!==old[1]||d[j+2]!==old[2]||d[j+3]!==old[3])continue;d[j]=c[0];d[j+1]=c[1];d[j+2]=c[2];d[j+3]=255;count++;const x=i%W;const tryAdd=n=>{if(!seen[n]&&!blocked[n]){seen[n]=1;stack[top++]=n}};if(x>0)tryAdd(i-1);if(x<W-1)tryAdd(i+1);if(i>=W)tryAdd(i-W);if(i<W*(H-1))tryAdd(i+W)}p.putImageData(pixels,0,0);status('Зафарбовано! 🎨')}
function stroke(a,b){p.save();p.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';p.strokeStyle=color;p.fillStyle=color;p.lineWidth=brushSize;p.lineCap='round';p.lineJoin='round';p.beginPath();p.moveTo(a.x,a.y);p.lineTo(b.x,b.y);p.stroke();p.beginPath();p.arc(b.x,b.y,brushSize/2,0,Math.PI*2);p.fill();p.restore()}
function startPaint(e){e.preventDefault();if(!blocked)return;const q=pos(e);if(tool==='fill'){flood(q.x,q.y);return}snapshot();drawing=true;last=q;if(e.pointerId!==undefined&&paint.setPointerCapture)paint.setPointerCapture(e.pointerId);stroke(q,q)}paint.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const q=pos(e);stroke(last,q);last=q});function stop(){drawing=false;last=null}paint.addEventListener('pointerup',stop);paint.addEventListener('pointercancel',stop);paint.addEventListener('pointerdown',startPaint);if(!window.PointerEvent){paint.addEventListener('touchstart',function(e){if(!e.touches.length)return;e.preventDefault();var t=e.touches[0];startPaint({preventDefault:function(){},clientX:t.clientX,clientY:t.clientY});},{passive:false});paint.addEventListener('touchmove',function(e){if(!drawing||!e.touches.length)return;e.preventDefault();var t=e.touches[0];var q=pos(t);stroke(last,q);last=q;},{passive:false});paint.addEventListener('touchend',stop);paint.addEventListener('touchcancel',stop);paint.addEventListener('mousedown',startPaint);paint.addEventListener('mousemove',function(e){if(!drawing)return;var q=pos(e);stroke(last,q);last=q;});window.addEventListener('mouseup',stop);}
function resetColoring(){
  sceneStates[currentScene]=null;
  drawing=false;last=null;
  // Reset all pixels, including fills, strokes, and partially transparent brush marks.
  p.setTransform(1,0,0,1,0,0);
  p.globalAlpha=1;
  p.globalCompositeOperation='source-over';
  p.clearRect(0,0,W,H);
  paint.width=W;paint.height=H;
  p=paint.getContext('2d',{willReadFrequently:true});
  p.clearRect(0,0,W,H);
  history=[];
  document.getElementById('undo').disabled=true;
  status('✓ Усі кольори видалено. Малюнок знову чорно-білий!');
}
document.getElementById('clear').onclick=()=>{resetColoring();sceneStates[currentScene]=null;persist()};
document.getElementById('save').onclick=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,W,H);ctx.drawImage(paint,0,0);ctx.drawImage(line,0,0);const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='squishy-'+(currentScene+1)+'-rozmalovka.png';a.click();status('Картинку збережено!')};

try{const saved=JSON.parse(localStorage.getItem(STORE)||'null');if(saved&&Array.isArray(saved.states)){saved.states.slice(0,12).forEach((v,i)=>sceneStates[i]=v);}}catch(e){}
const gallery=document.getElementById('gallery');
sceneNames.forEach((name,i)=>{const b=document.createElement('button');b.className='scene-card'+(i===0?' chosen':'');b.innerHTML='<span class="scene-icon">'+['🌈','🏖️','🚀','🎂','🏰','🍣','🌸','❄️','🐠','🎡','🧁','🏕️'][i]+'</span><span>'+(i+1)+'. '+name+'</span>';b.onclick=()=>switchScene(i);gallery.append(b)});
function switchScene(i){if(i===currentScene&&blocked)return;sceneStates[currentScene]=paint.toDataURL('image/png');persist();currentScene=i;document.querySelectorAll('.scene-card').forEach((b,j)=>b.classList.toggle('chosen',i===j));
 drawing=false;history=[];document.getElementById('undo').disabled=true;
 paint.width=W;paint.height=H;p=paint.getContext('2d',{willReadFrequently:true});
 line.width=W;line.height=H;blocked=null;status('Завантаження картинки…');artPreview.style.display='none';img.src=sceneImages[i]+'?v=5';
 document.getElementById('currentScene').textContent=(i+1)+' / 12 — '+sceneNames[i];
 document.getElementById('gallery').scrollIntoView({block:'nearest',behavior:'smooth'});
}
</script></body></html>
